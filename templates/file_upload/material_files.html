{% extends "../main.html" %}

{% block title %}{{ _("Game Materials") }}{% end %}

{% block header %}
<script src="/static/js/pages/file_upload/material_files.js"></script>
<script src="/static/js/libs/jstree.js"></script>
<link rel="stylesheet" href="/static/css/jstree.css" />
<link rel="stylesheet" href="/static/css/icons.css" />
{% end %}

{% block content %}
<div class="hf-page-head">
    <h1><i class="fa fa-folder-open-o"></i> {{ _("Game Materials") }}</h1>
</div>
{% if errors != None and len(errors) != 0 %}
    {% for error in errors %}
    <div class="alert alert-error">
        <a class="close" data-dismiss="alert" href="#">&times;</a>
        <h4 class="alert-heading">{{ _("ERROR") }}</h4>
        {{ error }}
    </div>
    {% end %}
{% end %}
<div class="hf-card">
    <div id="container" data-subdir="{{ subdir }}"></div>
</div>
{% end %}
