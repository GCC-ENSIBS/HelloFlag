{% extends "../main.html" %}

{% block title %}403{% end %}

{% block content %}
<div class="hf-card hf-status">
    <p class="hf-eyebrow">403</p>
    {% if locked %}
        <h1>{{ _("Account Locked!") }}</h1>
    {% elif xsrf %}
        <h1>{{ _("Invalid CSRF Token") }}</h1>
    {% else %}
        <h1>{{ _("Forbidden") }}</h1>
    {% end %}
    <img src="/static/images/epicsaxguy.gif" class="hf-avatar" width="420" alt="" />
    <audio autoplay loop>
        <source src="/static/epicsaxguy.mp3" type="audio/mpeg">
    </audio>
</div>
{% end %}
