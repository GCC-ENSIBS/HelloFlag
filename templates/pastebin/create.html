<div class="hf-card">
    <div class="hf-card-head"><h3>{{ _("Create New Paste") }}</h3></div>
    {% if errors is not None and len(errors) != 0 %}
        {% for error in errors %}
        <div class="alert alert-error">
            <a class="close" data-dismiss="alert" href="#">&times;</a>
            <h4 class="alert-heading">{{ _("ERROR") }}</h4>
            {{ error }}
        </div>
        {% end %}
    {% end %}
    <form id="create-paste" action="/user/share/pastebin/create" method="post" autocomplete="off">
        {% raw xsrf_form_html() %}
        {% from tornado.options import options %}
        {% if user.is_admin() %}
        {% from models.Team import Team %}
        <div class="control-group">
            <label class="control-label" for="team-uuid">{% if options.teams %}{{ _("Team") }}{% else %}{{ _("Player") }}{% end %}</label>
            <select id="team-uuid" name="team_uuid">
                <option value="all">All</option>
                {% for team in Team.all() %}
                <option value="{{ team.uuid }}">{{ team.name }}</option>
                {% end %}
            </select>
        </div>
        {% end %}
        <div class="control-group">
            <label class="control-label" for="name">{{ _("Name") }}</label>
            <input autofocus required name="name" id="name" maxlength="32" placeholder="{{ _('Paste Name') }}" type="text" />
        </div>
        <div class="control-group">
            <label class="control-label" for="content">{{ _("Content") }}</label>
            <textarea required id="content" name="content" maxlength="{{ options.max_pastebin_size }}" placeholder="{{ _('Paste Text Here') }}" rows="12"></textarea>
        </div>
        <div class="form-actions">
            <button class="btn btn-primary" type="submit">{{ _("Create New Paste") }}</button>
        </div>
    </form>
</div>
